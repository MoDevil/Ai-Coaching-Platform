name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-build-and-test:
    name: Backend Build & Test (.NET 8)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: aicoachos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore AiCoachOs.sln

      - name: Build solution
        run: dotnet build AiCoachOs.sln --no-restore --configuration Release

      - name: Run unit & integration tests
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=aicoachos_test;Username=postgres;Password=postgrespassword;"
        run: dotnet test AiCoachOs.sln --no-build --configuration Release --verbosity normal

  frontend-build-and-test:
    name: Frontend Build & Test (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: npm ci

      - name: Run frontend unit tests
        working-directory: src/frontend
        run: npm run test:ci

      - name: Build Angular app
        working-directory: src/frontend
        run: npm run build
