<div class="card trigger-card">
  <div class="card-header">
    <h3 class="section-title" style="margin: 0;">Trigger Evidence-Based Reasoning</h3>
  </div>
  <div class="trigger-form">
    <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1rem;">
      Select an assessment category. The reasoning engine evaluates the client's training profile, active safety flags, memory snapshot, and scientific evidence claims.
    </p>

    <div *ngIf="errorMessage" class="alert alert-danger" style="margin-bottom: 1rem;">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success" style="margin-bottom: 1rem;">
      {{ successMessage }}
    </div>

    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label" style="font-weight: 600;">Reasoning Category</label>
      <select class="form-control" [(ngModel)]="selectedCategory">
        <option *ngFor="let cat of Categories" [value]="cat">
          {{ CategoryLabels[cat] || cat }}
        </option>
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 1.25rem;">
      <label class="form-label" style="font-weight: 600;">Additional Context / Specific Questions (Optional)</label>
      <textarea
        class="form-control"
        rows="3"
        placeholder="e.g. Focus on shoulder stability or adjust for lower training frequency..."
        [(ngModel)]="additionalContext"
      ></textarea>
    </div>

    <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
      <button
        type="button"
        class="btn btn-primary"
        (click)="onTriggerReasoning()"
        [disabled]="isGenerating"
      >
        <span *ngIf="isGenerating" class="spinner"></span>
        {{ isGenerating ? 'Generating Reasoning...' : 'Run Reasoning Engine' }}
      </button>
    </div>
  </div>
</div>
