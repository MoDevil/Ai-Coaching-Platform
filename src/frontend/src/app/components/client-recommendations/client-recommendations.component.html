<div class="container">
  <!-- Header -->
  <div class="page-header">
    <div>
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <h1 class="page-title">
          <span *ngIf="client">{{ client.firstName }} {{ client.lastName }} — </span>
          AI Decision Package
        </h1>
        <span class="badge" style="background: var(--bg-tertiary); color: var(--accent-primary); font-size: 0.8125rem;">
          M18 Decision Support
        </span>
      </div>
      <p class="page-subtitle">
        Review, accept, reject, or archive AI-generated recommendations with linked scientific evidence.
      </p>
    </div>

    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
      <button
        type="button"
        class="btn btn-primary"
        (click)="showTriggerForm = !showTriggerForm"
      >
        {{ showTriggerForm ? 'Close Trigger Panel' : '+ Trigger AI Reasoning' }}
      </button>
      <a [routerLink]="['/clients', clientId]" class="btn btn-secondary">Back to Client Profile</a>
    </div>
  </div>

  <!-- Dedicated Trigger Reasoning Component -->
  <div *ngIf="showTriggerForm" style="margin-bottom: 1.5rem;">
    <app-trigger-reasoning
      [clientId]="clientId"
      (generated)="onReasoningGenerated($event)"
    ></app-trigger-reasoning>
  </div>

  <!-- Dedicated Recommendation History Component -->
  <app-recommendation-history
    #historyComp
    [clientId]="clientId"
  ></app-recommendation-history>
</div>
